<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecoleta - Contato</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Ecoleta</h1>
        <p>Entre em contato conosco</p>
    </header>
    <nav>
        <a href="index.html">Início</a>
        <a href="coletas.html">Coletas</a>
        <a href="pontos.html">Pontos de Coleta</a>
        <a href="sobre.html">Sobre</a>
        <a href="contato.html">Contato</a>
        <a href="login.html">Login</a>
    </nav>
    <main>
        <section class="conteudo">
            <h2>Entre em contato</h2>
            <p>
                Tem alguma dúvida, sugestão ou deseja entrar
                em contato com a equipe Ecoleta?
            </p>
            <div class="contato-info">
                <div>
                    <h3>Instagram</h3>
                    <p>@Ecoleta</p>
                </div>
                <div>
                    <h3>WhatsApp</h3>
                    <p>9XXXX-XX08</p>
                </div>
            </div>
            <h2>Envie uma mensagem</h2>
            <form>
                <div class="campo">
                    <label for="nome">Nome</label>

                    <input type="text" id="nome" placeholder="Digite seu nome" required>
                </div>
                <div class="campo">
                    <label for="email">E-mail</label>

                    <input type="email" id="email" placeholder="Digite seu e-mail" required>
                </div>
                <div class="campo">
                    <label for="assunto">Assunto</label>

                    <input type="text" id="assunto" placeholder="Digite o assunto" required>
                </div>
                <div class="campo">
                    <label for="mensagem">Mensagem</label>

                    <textarea id="mensagem" rows="6" placeholder="Digite sua mensagem" required></textarea>
                </div>
                <button type="submit">
                    Enviar mensagem
                </button>
            </form>
        </section>
    </main>
    <footer>
        <p>2026 - Ecoleta</p>
    </footer>
</body>
</html>
